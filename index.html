<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006D4F" />
    <meta name="description" content="eProcure, the procurement portal of the Bids and Awards Committee." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>eProcure | Bids and Awards Committee</title>
    <script>
      // Apply a stored light/dark choice before first paint (see src/lib/viewTransition.js).
      try { var t = localStorage.getItem('eprocure-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
